<svg viewBox="0 0 900 470" style="width:100%;height:auto;display:block" role="img" aria-labelledby="anch-t anch-d">
          <title id="anch-t">Where to look on a central air conditioning system, and what is safe to touch</title>
          <desc id="anch-d">A house cross-section. Inside: a thermostat on the wall at check one, a return grille and filter at check two, and the indoor air handler cabinet with its coil and blower. Outside: the condenser unit with its top fan at check three. Two insulated refrigerant lines run between them, with the larger line marked as the one to inspect for ice at check four. Green markers show what a homeowner can safely look at and photograph. Red markers show the sealed electrical and refrigerant areas that only a licensed technician may open.</desc>
