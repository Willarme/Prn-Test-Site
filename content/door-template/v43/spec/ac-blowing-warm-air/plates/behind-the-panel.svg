<svg viewBox="0 0 880 380" style="width:100%;height:auto;display:block;background:#FCFCFA;border-radius:6px" role="img" aria-labelledby="cond-t cond-d">
  <title id="cond-t">Inside a condenser unit: the parts that fail, and why the panel stays closed</title>
  <desc id="cond-d">A technical cutaway line drawing of an outdoor air conditioning condenser. The top fan draws air upward through the cabinet. Around the inside walls sits the condenser coil with its fins. In the electrical compartment on the right are the run capacitor, drawn as a cylinder, and the contactor beside it. The compressor sits in the base of the cabinet as a heavy cylindrical shape. Numbered leader lines identify the fan, the coil and fins, the service disconnect on the wall, the capacitor and the contactor, and the compressor. The electrical compartment is marked as sealed and licensed work only.</desc>
  <defs>
    <pattern id="f3fin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M5 0 V10" stroke="#12161A" stroke-width="0.9" opacity=".28"/></pattern>
    <pattern id="f3hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V7" style="stroke:var(--b-deep)" stroke-width="0.9" opacity=".4"/></pattern>
    <pattern id="f3wall" width="14" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 H14" stroke="#C8CCC4" stroke-width="1"/></pattern>
  </defs>

  <!-- exterior wall behind the disconnect, grounding it as a separate mounted box -->
  <rect x="676" y="128" width="118" height="212" rx="4" fill="url(#f3wall)" stroke="#C8CCC4" stroke-width="1.5"/>
  <line x1="676" y1="150" x2="794" y2="150" stroke="#C8CCC4" stroke-width="1"/>
  <line x1="676" y1="172" x2="794" y2="172" stroke="#C8CCC4" stroke-width="1"/>

  <!-- cabinet -->
  <rect x="250" y="100" width="380" height="232" rx="8" fill="#FCFCFA" stroke="#12161A" stroke-width="2.2"/>
  <line x1="250" y1="112" x2="630" y2="112" stroke="#12161A" stroke-width="2.6"/>
  <rect x="240" y="332" width="400" height="10" rx="2" fill="#F2F3F0" stroke="#12161A" stroke-width="1.6"/>
  <circle cx="262" cy="112" r="3.4" fill="#12161A"/>
  <circle cx="618" cy="112" r="3.4" fill="#12161A"/>
  <circle cx="262" cy="322" r="3.4" fill="#12161A"/>
  <circle cx="618" cy="322" r="3.4" fill="#12161A"/>

  <!-- top fan shroud + guard grille -->
  <path d="M372 100 V72" stroke="#12161A" stroke-width="2.2"/>
  <path d="M508 100 V72" stroke="#12161A" stroke-width="2.2"/>
  <ellipse cx="440" cy="72" rx="68" ry="18" fill="#FCFCFA" stroke="#12161A" stroke-width="2.2"/>
  <ellipse cx="440" cy="72" rx="46" ry="11" fill="none" stroke="#12161A" stroke-width="1.3"/>
  <circle cx="440" cy="72" r="8" fill="#12161A"/>
  <line x1="404" y1="64" x2="404" y2="80" stroke="#12161A" stroke-width="1.3"/>
  <line x1="420" y1="60" x2="420" y2="84" stroke="#12161A" stroke-width="1.3"/>
  <line x1="460" y1="60" x2="460" y2="84" stroke="#12161A" stroke-width="1.3"/>
  <line x1="476" y1="64" x2="476" y2="80" stroke="#12161A" stroke-width="1.3"/>

  <!-- coil and fins along the inside wall (blue = safe to look at) -->
  <rect x="262" y="150" width="120" height="90" fill="var(--a-tint)" style="fill:var(--a-tint)" stroke="#12161A" stroke-width="2"/>
  <rect x="262" y="150" width="120" height="90" fill="url(#f3fin)"/>
  <line x1="270" y1="155" x2="270" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="282" y1="155" x2="282" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="294" y1="155" x2="294" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="306" y1="155" x2="306" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="318" y1="155" x2="318" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="330" y1="155" x2="330" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="342" y1="155" x2="342" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="354" y1="155" x2="354" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="366" y1="155" x2="366" y2="235" stroke="#12161A" stroke-width="1"/>
  <line x1="378" y1="155" x2="378" y2="235" stroke="#12161A" stroke-width="1"/>
  <path d="M262 170 H382 M262 190 H382 M262 210 H382" style="stroke:var(--a)" stroke-width="2" fill="none"/>

  <!-- electrical compartment, sealed (pink = danger / licensed only) -->
  <rect x="460" y="118" width="160" height="122" style="fill:color-mix(in srgb,var(--b) 12%,white)" stroke="none"/>
  <rect x="460" y="118" width="160" height="122" fill="url(#f3hatch)"/>
  <rect x="460" y="118" width="160" height="122" fill="none" style="stroke:var(--b-deep)" stroke-width="2.4"/>
  <circle cx="468" cy="127" r="3" style="fill:var(--b-deep)"/>
  <circle cx="612" cy="127" r="3" style="fill:var(--b-deep)"/>
  <circle cx="468" cy="232" r="3" style="fill:var(--b-deep)"/>
  <circle cx="612" cy="232" r="3" style="fill:var(--b-deep)"/>
  <ellipse cx="505" cy="186" rx="17" ry="6" fill="#FCFCFA" stroke="#12161A" stroke-width="1.8"/>
  <rect x="488" y="186" width="34" height="38" fill="#FCFCFA" stroke="#12161A" stroke-width="1.8"/>
  <path d="M488 224 a17 6 0 0 0 34 0" fill="#FCFCFA" stroke="#12161A" stroke-width="1.8"/>
  <line x1="488" y1="196" x2="522" y2="196" stroke="#12161A" stroke-width="1.1"/>
  <line x1="488" y1="210" x2="522" y2="210" stroke="#12161A" stroke-width="1.1"/>
  <rect x="544" y="198" width="52" height="28" rx="4" fill="#FCFCFA" stroke="#12161A" stroke-width="1.8"/>
  <line x1="556" y1="198" x2="556" y2="184" stroke="#12161A" stroke-width="1.6"/>
  <line x1="570" y1="198" x2="570" y2="184" stroke="#12161A" stroke-width="1.6"/>
  <line x1="584" y1="198" x2="584" y2="184" stroke="#12161A" stroke-width="1.6"/>
  <line x1="544" y1="212" x2="596" y2="212" stroke="#12161A" stroke-width="1.1"/>

  <!-- compressor, its own clear band across the base of the cabinet -->
  <ellipse cx="440" cy="290" rx="120" ry="16" fill="#FCFCFA" stroke="#12161A" stroke-width="2.2"/>
  <rect x="320" y="290" width="240" height="34" fill="#FCFCFA" stroke="#12161A" stroke-width="2.2"/>
  <path d="M320 324 a120 16 0 0 0 240 0" fill="#FCFCFA" stroke="#12161A" stroke-width="2.2"/>
  <path d="M330 300 H550 M330 312 H550" stroke="#12161A" stroke-width="1.1" opacity=".7"/>
  <rect x="350" y="326" width="20" height="8" rx="2" fill="#F2F3F0" stroke="#12161A" stroke-width="1.2"/>
  <rect x="510" y="326" width="20" height="8" rx="2" fill="#F2F3F0" stroke="#12161A" stroke-width="1.2"/>
  <line x1="350" y1="240" x2="350" y2="276" style="stroke:var(--a)" stroke-width="2"/>
  <line x1="530" y1="240" x2="530" y2="276" style="stroke:var(--a)" stroke-width="2"/>

  <!-- disconnect box, mounted on the wall beside the unit -->
  <rect x="702" y="222" width="66" height="80" rx="4" fill="#FCFCFA" stroke="#12161A" stroke-width="2"/>
  <rect x="716" y="238" width="38" height="14" rx="3" fill="none" stroke="#12161A" stroke-width="1.6"/>
  <line x1="716" y1="266" x2="754" y2="266" stroke="#12161A" stroke-width="1.1"/>
  <line x1="716" y1="278" x2="754" y2="278" stroke="#12161A" stroke-width="1.1"/>
  <circle cx="712" cy="230" r="2.6" fill="#12161A"/>
  <circle cx="758" cy="230" r="2.6" fill="#12161A"/>

  <!-- leader lines -->
  <g stroke="#5A6462" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="230" y1="75" x2="372" y2="75"/>
    <line x1="230" y1="195" x2="262" y2="195"/>
    <line x1="755" y1="179" x2="620" y2="179"/>
    <line x1="230" y1="300" x2="320" y2="300"/>
    <line x1="785" y1="262" x2="768" y2="262"/>
  </g>

  <!-- badges -->
  <circle cx="20" cy="75" r="13" style="fill:var(--a)"/><text x="20" y="80" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="#fff">1</text>
  <circle cx="20" cy="195" r="13" style="fill:var(--a)"/><text x="20" y="200" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="#fff">2</text>
  <circle cx="780" cy="179" r="13" style="fill:var(--b-deep)"/><text x="780" y="184" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="#fff">3</text>
  <circle cx="20" cy="300" r="13" style="fill:var(--a)"/><text x="20" y="305" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="#fff">4</text>
  <circle cx="800" cy="262" r="13" style="fill:var(--a)"/><text x="800" y="267" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="#fff">5</text>

  <!-- primary labels -->
  <text x="44" y="80" font-family="inherit" font-size="16" fill="#12161A">fan, is it turning?</text>
  <text x="44" y="200" font-family="inherit" font-size="16" fill="#12161A">coil and fins</text>
  <text x="44" y="305" font-family="inherit" font-size="16" fill="#12161A">compressor</text>
  <text x="44" y="322" font-family="inherit" font-size="12.5" fill="#5A6462">sealed system</text>
  <text x="862" y="118" text-anchor="end" font-family="inherit" font-size="12" style="fill:var(--b-deep)" font-weight="600"> </text>

  <!-- electrical compartment labels -->
  <text x="540" y="152" text-anchor="middle" font-family="inherit" font-size="15" style="fill:var(--b-deep)" font-weight="700">capacitor + contactor</text>
  <text x="525" y="256" text-anchor="middle" font-family="inherit" font-size="13" style="fill:var(--b-deep)" font-weight="600" paint-order="stroke" stroke="#FCFCFA" stroke-width="6" stroke-linejoin="round">holds a charge with power off</text>
  <text x="735" y="320" text-anchor="middle" font-family="inherit" font-size="13" fill="#5A6462">disconnect</text>

  <text x="440" y="368" text-anchor="middle" font-family="inherit" font-size="11" fill="#5A6462" letter-spacing="2">CONDENSER &#183; CUTAWAY &#183; RED AREA IS LICENSED WORK ONLY</text>
</svg>