<!-- ================= GENERAL VS YOURS ================= -->
<section class="sec chapter" id="general-vs-yours">
  <div class="wrap">
    <div class="chapter-head"><p class="eyebrow"><i class="pennant" aria-hidden="true"></i>What you are actually choosing between</p>
    <h2 class="display h2">{%general_vs_yours.heading_html%}</h2></div>
    <div class="ledger"><div class="scroll" tabindex="0" role="group" aria-label="Table, scrolls sideways on small screens">
      <table>
        <thead><tr>
{%each general_vs_yours.columns%}          <th scope="col" class="{%.mw_class%}">{%.label%}</th>
{%/each%}        </tr></thead>
        <tbody>
{%each general_vs_yours.rows%}          <tr><td><strong>{%.where%}</strong></td><td class="muted">{%.gives%}</td><td><strong>{%.ours%}</strong></td></tr>
{%/each%}        </tbody>
      </table>
    </div><span class="scroll-hint" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
</section>
