<!-- ================= CAPABILITY QUESTIONS ================= -->
<section class="sec chapter dark" id="what-this-tool-can-answer">
  <div class="wrap">
    <p class="eyebrow"><i class="pennant" aria-hidden="true"></i>LIVE, on your system</p>
    <h2 class="display h2">{%capability.heading_html%}</h2>
    <div class="ledger"><div class="scroll" tabindex="0" role="group" aria-label="Table, scrolls sideways on small screens">
      <table>
        <thead><tr>
{%each capability.columns%}          <th scope="col" class="{%.mw_class%}">{%.label%}</th>
{%/each%}        </tr></thead>
        <tbody>
{%each capability.rows%}          <tr><td><strong>{%.ask%}</strong></td><td class="muted">{%.tells%}</td><td><span class="chip {%.chip_class%}">{%.chip_label%}</span></td></tr>
{%/each%}        </tbody>
      </table>
    </div><span class="scroll-hint" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
  <div class="band bar" id="band-3"><div class="wrap"><p>{%capability.band_hook_html%}</p></div></div>
</section>
