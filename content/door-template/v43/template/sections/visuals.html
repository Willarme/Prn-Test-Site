<!-- ================= VISUALS ================= -->
<section class="sec tint tint-cool chapter dark" id="visual-explainers">
  <div class="wrap">
    <div class="vx-head">
    <p class="eyebrow"><i class="pennant" aria-hidden="true"></i>Drawn for your walkthrough</p>
    <h2 class="display h2">{%visuals.heading_html%}</h2>
    </div>
    <div class="plates">
      {%each visuals.plates%}<div class="fig plate{%.plate_class|%}"><figure>
        <div class="fig-frame"><div class="fig-scroll" tabindex="0" data-scroll>
        {%file .file%}
        </div><span class="scroll-hint" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        <figcaption>{%.caption_html%}</figcaption>
      </figure></div>{%.post|\n      %}{%/each%}</div>
  </div>
</section>
